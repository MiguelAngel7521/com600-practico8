name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Preparar Node.js 22 sin caché
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund
      - name: Ejecutar la suite de la Práctica 7 con cobertura
        run: npm run test:cov
      - name: Publicar el reporte como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-22-${{ github.sha }}
          path: coverage/
          retention-days: 7
          if-no-files-found: warn
