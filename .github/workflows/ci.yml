name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    name: pruebas (${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Preparar Node.js ${{ matrix.node }} con caché
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund
      - name: Ejecutar la suite de la Práctica 7 con cobertura
        run: npm run test:cov
      - name: Publicar el reporte como artefacto
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cobertura-${{ matrix.node }}-${{ github.sha }}
          path: coverage/
          retention-days: 7
          if-no-files-found: warn

  calidad:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund
      - name: Análisis estático sin avisos
        run: npm run lint
      - name: Escaneo de dependencias (bloquea high y critical)
        run: npm run audit

  imagen:
    needs: [pruebas, calidad]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - name: Preparar nombre y etiquetas trazables
        id: meta
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          IMAGE="ghcr.io/${REPOSITORY,,}"
          VERSION=$(node -p "require('./package.json').version")
          {
            echo "tags<<EOF"
            echo "$IMAGE:$GITHUB_SHA"
            echo "$IMAGE:$VERSION"
            echo "$IMAGE:$VERSION-ci.$GITHUB_RUN_NUMBER"
            echo "$IMAGE:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Preparar Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Iniciar sesión en GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construir y publicar la imagen
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          cache-from: type=gha,scope=practica8-api
          cache-to: type=gha,mode=max,scope=practica8-api
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
